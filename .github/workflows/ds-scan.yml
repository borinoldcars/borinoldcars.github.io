name: Outil temporaire - recherche DS dans les photos
permissions:
  contents: write
on:
  push:
    branches: [ claude/borin-old-cars-app-tatt50 ]
    paths: [ tools/ds/request.json ]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pillow requests
      - name: Install rembg (cutout only)
        run: |
          if grep -qE "\"(cutout|sam)\"" tools/ds/request.json; then pip install "rembg[cpu]"; fi
      - run: python tools/ds/run.py
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add tools/ds/out
          git commit -m "Outil DS : résultats" || echo "rien"
          git push
